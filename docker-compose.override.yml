services:
  backend:
    volumes:
      - ./backend:/app
    user: root
    command: flask run --host=0.0.0.0 --port=5000 --debug
    environment:
      - FLASK_APP=run.py
      - FLASK_DEBUG=1

  frontend:
    build:
      target: deps
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
